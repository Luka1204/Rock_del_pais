{% extends "base.html" %}
{% load static %}
{% block title %}Eliminar producto | Rock del País{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{% static 'store/tienda.css' %}">{% endblock %}
{% block content %}
<section class="shop wrap">
  <div class="edit-card">
    <span class="shop-kicker">GESTIÓN DEL CATÁLOGO</span>
    <h1>Eliminar producto</h1>
    <p>¿Seguro que querés eliminar «{{ producto.name }}»?</p>
    <form method="post">{% csrf_token %}
      <div class="edit-actions">
        <button class="shop-button" type="submit">Eliminar producto</button>
        <a class="shop-button shop-button-outline" href="{% url 'management_product_list' %}">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
